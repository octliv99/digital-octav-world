<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octavian Liviu Gherghe</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

 
 
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
 
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.038;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 180px 180px;
  background-repeat: repeat;
}
 
html { background: #F4F1EC; min-height: 100vh; }
 
body {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  color: #1C1814;
}
 
.phrase-wrap {
  height: 28px;
  margin-bottom: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
}
 
.phrase {
  font-family: 'IM Fell English', Georgia, serif;
  font-style: italic;
  font-size: 15px;
  color: #9E8E7A;
  letter-spacing: 0.04em;
  position: relative;
}
 
.phrase::after {
  content: '|';
  margin-left: 1px;
  animation: blink 1s step-end infinite;
  color: #C2B49E;
}
 
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}
 
.centre {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
 
.name {
  font-family: 'IM Fell English', Georgia, serif;
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.1;
  color: #1C1814;
  margin-bottom: 8px;
}
 
.name em { font-style: italic; color: #3A6245; }
 
.rule {
  width: 40px;
  height: 0.5px;
  background: #C2B49E;
  margin-bottom: 52px;
}
 
.links {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  margin-bottom: 52px;
}
 
.link-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  text-decoration: none;
  color: #1C1814;
  font-size: 13px;
  font-family: 'IM Fell English', Georgia, serif;
  transition: color 0.2s;
}
 
.link-item:hover { color: #3A6245; }
 
.link-item .arrow {
  font-size: 14px;
  color: #C2B49E;
  display: inline-block;
  position: relative;
  transition: color 0.15s;
  image-rendering: pixelated;
}
 
.link-item:hover .arrow {
  animation: pixelburn 0.5s steps(6, end) forwards;
}
 
@keyframes pixelburn {
  0%   { color: #C2B49E; transform: scale(1);               opacity: 1; }
  20%  { color: #3A6245; transform: scale(1.3);             opacity: 1; }
  40%  { color: #5DB868; transform: scale(0.9) rotate(15deg);  opacity: 0.8; }
  60%  { color: #2A4A32; transform: scale(1.4) rotate(-10deg); opacity: 0.5; }
  80%  { color: #1E3828; transform: scale(0.6) rotate(20deg);  opacity: 0.3; }
  100% { color: transparent; transform: scale(0);           opacity: 0; }
}
 
.currently { text-align: center; max-width: 340px; }
 
.currently-label {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #6B6058;
  margin-bottom: 14px;
}
 
.project-name {
  font-family: 'IM Fell English', Georgia, serif;
  font-size: 18px;
  font-style: italic;
  color: #6B6058;
  margin-bottom: 6px;
}
 
.project-desc {
  font-size: 13px;
  line-height: 1.8;
  color: #4A4440;
  letter-spacing: 0.04em;
}
 
footer {
  position: fixed;
  bottom: 28px;
  left: 0; right: 0;
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: #C2B49E;
  text-transform: uppercase;
  z-index: 1;
}
 
@media (max-width: 480px) {
  body { padding: 60px 20px; }
  .phrase-wrap { margin-bottom: 40px; }
  .rule { margin-bottom: 36px; }
  .links { margin-bottom: 36px; }
}
 
</style>
</head>
<body>
 
<div class="phrase-wrap">
  <span class="phrase" id="phrase"></span>
</div>
 
<div class="centre">
 
  <h1 class="name">Octavian <em>Liviu</em> Gherghe</h1>
 
  <div class="rule"></div>
 
  <nav class="links">
    <a class="link-item" href="https://eportfolio.ocadu.ca/exhibitor/details/543c2b8b-970b-4c68-8804-b6059a3c1d84" target="_blank" rel="noopener">
      <span class="arrow">·</span> Portfolio
    </a>
    <a class="link-item" href="mailto:octliv99@gmail.com">
      <span class="arrow">·</span> octliv99@gmail.com
    </a>
  </nav>
 
  <div class="currently">
    <p class="currently-label">current work</p>
    <p class="project-name">Subfloora</p>
    <p class="project-desc">
      A biophilic planter tower for Toronto's<br>
      concentrated urban spaces.<br>
      GRADEX 2026 — OCAD University
    </p>
  </div>
 
</div>
 
<footer>thisisleavingyou</footer>
 
<script>
const phrases = [
  "this is leaving you",
  "make it memorable",
  "industrial designer",
  "toronto, canada",
];
 
let pi = 0, ci = 0, deleting = false;
const el = document.getElementById('phrase');
 
function tick() {
  const current = phrases[pi];
  if (!deleting) {
    el.textContent = current.slice(0, ci + 1);
    ci++;
    if (ci === current.length) {
      deleting = true;
      setTimeout(tick, 2200);
      return;
    }
    setTimeout(tick, 58);
  } else {
    el.textContent = current.slice(0, ci - 1);
    ci--;
    if (ci === 0) {
      deleting = false;
      pi = (pi + 1) % phrases.length;
      setTimeout(tick, 400);
      return;
    }
    setTimeout(tick, 32);
  }
}
 
tick();
</script>
 
</body>
</html>
